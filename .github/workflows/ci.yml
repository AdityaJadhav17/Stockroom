name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

defaults:
  run:
    shell: pwsh

jobs:
  repository-checks:
    name: Repository Structure Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check documents and repository files
        run: ./scripts/Test-Repository.ps1

  dependency-audit:
    name: Dependency Security Audit
    needs: repository-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked packages and audit dependencies
        run: ./scripts/Test-Dependencies.ps1

  build:
    name: Release Build
    needs: repository-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked packages
        run: dotnet restore Stockroom.slnx --locked-mode

      - name: Build Release solution
        run: dotnet build Stockroom.slnx --configuration Release --no-restore --warnaserror

  integration-tests:
    name: Integration Tests (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked packages
        run: dotnet restore Stockroom.slnx --locked-mode

      - name: Build integration test host
        run: dotnet build tests/integration/Stockroom.IntegrationTests.csproj --configuration Release --no-restore --warnaserror

      - name: Run integration tests
        id: tests
        run: >-
          dotnet test --project tests/integration/Stockroom.IntegrationTests.csproj
          --configuration Release --no-build
          --minimum-expected-tests 1
          --results-directory "${{ github.workspace }}/TestResults"
          --report-xunit-trx --report-xunit-trx-filename integration.trx

      - name: Upload test reports
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: error
          retention-days: 14

  e2e-tests:
    name: End-to-End Tests
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STOCKROOM_E2E_ARTIFACTS: ${{ github.workspace }}/TestResults/e2e-artifacts
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked packages
        run: dotnet restore Stockroom.slnx --locked-mode

      # The fixture starts the web application's own build output as a separate process. Separate steps
      # make each build's exit code fail the job; PowerShell does not stop on a failed native command.
      - name: Build web application
        run: dotnet build src/Stockroom.Web/Stockroom.Web.csproj --configuration Release --no-restore --warnaserror

      - name: Build browser tests
        run: dotnet build tests/e2e/Stockroom.E2ETests.csproj --configuration Release --no-restore --warnaserror

      - name: Install Chromium and Linux dependencies
        run: ./tests/e2e/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run browser tests
        id: tests
        run: >-
          dotnet test --project tests/e2e/Stockroom.E2ETests.csproj
          --configuration Release --no-build
          --minimum-expected-tests 1
          --results-directory "${{ github.workspace }}/TestResults"
          --report-xunit-trx --report-xunit-trx-filename e2e.trx

      - name: Upload test reports and failure diagnostics
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: TestResults/
          if-no-files-found: error
          retention-days: 14

  ci-status:
    name: CI Status
    if: ${{ always() }}
    needs: [repository-checks, dependency-audit, build, integration-tests, e2e-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          $results = $env:JOB_RESULTS | ConvertFrom-Json -AsHashtable
          $summary = @('## CI results', '', '| Job | Result |', '| --- | --- |')
          foreach ($job in $results.GetEnumerator() | Sort-Object Key) {
              $summary += "| $($job.Key) | $($job.Value.result) |"
          }
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          $failed = @($results.GetEnumerator() | Where-Object { $_.Value.result -ne 'success' })
          if ($failed.Count -gt 0) {
              $failed | ForEach-Object { Write-Output "$($_.Key): $($_.Value.result)" }
              throw 'CI requires every job to succeed. Failed, skipped, or cancelled jobs cannot pass this check.'
          }
          Write-Output 'All required CI jobs passed.'
